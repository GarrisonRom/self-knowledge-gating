config_version: 1

project:
  name: self-knowledge-gating
  experiment: bge-reranker-materials-full-seed42

run:
  id: bge-reranker-matsci-v1-seed42
  output_dir: results/runs/bge-reranker-matsci-v1-seed42
  overwrite: false

seed: 42

data:
  train_pairs: data/processed/pairs_train.jsonl
  dev_pairs: data/processed/pairs_dev.jsonl
  test_pairs: data/processed/pairs_test.jsonl
  max_train_queries: null
  dev_quick_limit: 300
  hard_negatives_per_query: 3

models:
  base_reranker: models/modelscope/models/BAAI--bge-reranker-v2-m3/snapshots/master
  finetuned_reranker: models/finetuned/bge-reranker-v2-m3-matsci-v1-seed42

training:
  epochs: 1.0
  queries_per_batch: 4
  gradient_accumulation: 8
  learning_rate: 0.00002
  weight_decay: 0.01
  warmup_fraction: 0.05
  max_length: 512
  eval_every_steps: 300
  dataloader_workers: 0
  precision: bf16
  gradient_checkpointing: true
  deterministic_algorithms: true

evaluation:
  split: test
  batch_queries: 8
  max_length: 512
  include_baseline: true
  metrics:
    - top1_accuracy
    - mrr_at_candidates
    - ndcg_at_candidates
    - hard_negative_distinction
