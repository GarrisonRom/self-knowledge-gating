[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "self-knowledge-gating"
version = "0.1.0"
description = "Calibrated self-knowledge gating for adaptive retrieval and abstention in LLM systems."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
skg-pipeline-demo = "self_knowledge_gating.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
