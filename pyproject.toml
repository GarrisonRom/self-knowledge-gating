[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "self-knowledge-gating"
version = "0.1.0"
description = "Calibrated self-knowledge gating for adaptive retrieval and abstention in LLM systems."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
retrieval = [
    "modelscope>=1.18",
    "FlagEmbedding>=1.3",
    "transformers>=4.40",
    "torch>=2.1",
    "accelerate>=0.30",
    "safetensors>=0.4",
    "sentencepiece>=0.2",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "scikit-learn>=1.3",
]

[project.scripts]
skg-pipeline-demo = "self_knowledge_gating.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
